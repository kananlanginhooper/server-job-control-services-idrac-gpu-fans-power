[project]
name = "sjc-hw"
version = "0.1.0"
description = "Shared hardware helpers: iDRAC (ipmitool), NVIDIA GPU, controller state, system metrics"
requires-python = ">=3.9"
dependencies = ["psutil>=5.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sjc_hw"]
